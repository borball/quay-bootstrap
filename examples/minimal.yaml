# Latest operator, ingress wildcard certificate, NooBaa-managed storage, generated admin password.
registry:
  hostname: quay                         # optional; bare label -> quay.<apps domain>

admin:
  username: quayadmin
  email: quayadmin@example.com

organizations:
  - name: platform
    robots: [ci_push]
    repositories:
      - name: app1
        permissions:
          - {robot: ci_push, role: write}
  - name: quay-io
    proxyCache:
      upstream: quay.io
